# IDE 등 호스트에서 실행할 때 사용할 로컬 기본값입니다.
# Compose는 호스트 이름을 서비스 DNS로 덮어쓰며, 실제 환경변수가 우선합니다.
POSTGRES_DB_URL: jdbc:postgresql://localhost:5432/secondbrain
POSTGRES_USER: secondbrain
POSTGRES_PASSWORD: local-postgres-password
REDIS_HOST: localhost
REDIS_PORT: 6379
REDIS_PASSWORD: local-redis-password
# ElasticsearchConfig.connectedTo는 scheme 없는 host:port를 받습니다.
ELASTICSEARCH_URIS: localhost:9200
ELASTICSEARCH_USERNAME: ""
ELASTICSEARCH_PASSWORD: ""
NEO4J_URI: bolt://localhost:7687
NEO4J_USERNAME: neo4j
NEO4J_PASSWORD: local-neo4j-password
RABBITMQ_HOST: localhost
RABBITMQ_PORT: 5672
RABBITMQ_USERNAME: secondbrain
RABBITMQ_PASSWORD: local-rabbit-password
RABBITMQ_VIRTUAL_HOST: secondbrain
RABBITMQ_SSL_ENABLED: false
BASE_URL: http://localhost:8080
# 성공 핸들러가 /auth/callback을 추가하므로 루트 주소입니다.
OAUTH2_REDIRECT_URL: http://localhost:5173
OAUTH2_FAILURE_REDIRECT_URL: http://localhost:5173/?error=true
JWT_COOKIE_SECURE: false
JWT_SECRET: local-development-only-change-this-secret-32-bytes
# 확장 프로그램 content script가 현재 페이지의 origin으로 요청합니다.
CORS_ALLOWED_ORIGIN: "*"

# 기동용 더미 값입니다. 실제 외부 기능 사용 시 개인 자격증명으로 설정하세요.
GOOGLE_CLIENT_ID: local-not-configured
GOOGLE_CLIENT_SECRET: local-not-configured
ACCESS_KEY: local-not-configured
SECRET_ACCESS_KEY: local-not-configured
REGION: ap-northeast-2
BUCKET_NAME: secondbrain-local
GMS_API_KEY: local-not-configured
GMS_MODEL: local-not-configured
GMS_EMBEDDING_MODEL: text-embedding-3-small
GMS_MAX_TOKENS: 1024
GMS_TEMPERATURE: 0.7
CLOVA_CLIENT_ID: local-not-configured
CLOVA_CLIENT_SECRET: local-not-configured

# 명시적으로 설정하기 전 외부 API에 요청하지 않도록 loopback으로 제한합니다.
GMS_BASE_URL: http://127.0.0.1:9
GMS_OPENAI_BASE_URL: http://127.0.0.1:9/v1
CLOVA_API_URL: http://127.0.0.1:9/tts
spring:
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  cloud:
    aws:
      s3:
        endpoint: ${S3_ENDPOINT:http://127.0.0.1:9}
        path-style-access-enabled: true
server:
  tomcat:
    threads:
      max: 30
      min-spare: 2
logging:
  level:
    uknowklp.secondbrain: INFO
