plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'uknowklp'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

ext {
	set('springCloudAwsVersion', "4.1.1")
	set('awsSdkVersion', "2.55.4")
	set('elasticsearch-client.version', "9.5.4")
	set('neo4j-java-driver.version', "6.3.0")
	set('lombok.version', "1.18.48")
	set('jackson-bom.version', "3.2.3")
	set('jackson-2-bom.version', "2.22.3")
	set('hibernate.version', "7.4.10.Final")
	set('netty.version', "4.2.18.Final")
	set('rabbit-amqp-client.version', "5.36.0")
	set('lettuce.version', "7.7.0.RELEASE")
	set('hikaricp.version', "7.1.0")
	set('hibernate-validator.version', "9.1.4.Final")
	set('tomcat.version', "11.0.26")
	set('logback.version', "1.6.3")
	set('junit-jupiter.version', "6.1.3")
	set('mockito.version', "5.24.0")
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencyManagement {
	imports {
		mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
		mavenBom "software.amazon.awssdk:bom:${awsSdkVersion}"
	}
}

dependencies {

	// Database
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-neo4j'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
	runtimeOnly 'org.postgresql:postgresql'

	// RabbitMQ
	implementation 'org.springframework.boot:spring-boot-starter-amqp'

	// WebFlux (WebClient 사용 위함)
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	// Apple Silicon에서 Reactor Netty의 macOS DNS resolver를 사용합니다.
	runtimeOnly 'io.netty:netty-resolver-dns-native-macos::osx-aarch_64'

	// AWS S3
	implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
	implementation 'software.amazon.awssdk:s3'

	// Auth
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// WebSocket
	implementation 'org.springframework.boot:spring-boot-starter-websocket'

	// JWT
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'

	// 웹 Google ID Token 검증
	implementation 'com.google.api-client:google-api-client:2.9.1'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Swagger/OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'

	// 환경변수
	implementation 'me.paulschwarz:spring-dotenv:5.1.0'

	// Vertex AI REST 호출에 사용하는 Application Default Credentials
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.50.0'

	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'integration'
	}
}

tasks.register('integrationTest', Test) {
	description = '로컬 데이터 서비스에 연결해 Spring 애플리케이션 기동을 검증합니다.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'integration'
	}
	shouldRunAfter test
}

tasks.withType(Test).configureEach {
	maxHeapSize = '384m'
	// 개발자의 .env를 자동으로 읽지 않도록 테스트는 빈 작업 폴더에서 실행합니다.
	workingDir = layout.buildDirectory.dir('test-work').get().asFile
	doFirst {
		workingDir.mkdirs()
	}
}
