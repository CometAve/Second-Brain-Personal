name: secondbrain-local

x-common: &common
  restart: "no"
  logging:
    driver: json-file
    options:
      max-size: "5m"
      max-file: "2"

x-ai-env: &ai-env
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-neo4j-password}
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: ${RABBITMQ_USER:-secondbrain}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-rabbit-password}
  RABBITMQ_VHOST: secondbrain
  SECONDBRAIN_API_URL: http://backend:8080/api/
  OPENAI_API_KEY: ${OPENAI_API_KEY:-local-placeholder}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://127.0.0.1:9/v1}
  OPENAI_MODEL: ${OPENAI_MODEL:-text-embedding-3-small}
  SUMMARIZE_MODEL: ${SUMMARIZE_MODEL:-gpt-4o-mini}
  SUMMARIZE_TEMPERATURE: "0"
  SEARCH_AGENT_MODEL: ${SEARCH_AGENT_MODEL:-gpt-4o-mini}
  SEARCH_AGENT_TEMPERATURE: "0"
  SIMILARITY_THRESHOLD: "0.7"
  MAX_RELATIONSHIPS: "10"
  TOP_K: "3"
  SEARCH_LIMIT: "20"

services:
  postgres:
    <<: *common
    image: postgres:18.6-alpine
    profiles: [data, backend, worker, full]
    environment:
      POSTGRES_DB: secondbrain
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]
    volumes: [postgres18-data:/var/lib/postgresql]
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    <<: *common
    image: redis:8.10.2-alpine
    profiles: [data, backend, worker, full]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
    command: [sh, -c, 'exec redis-server --appendonly yes --maxmemory 80mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    ports: ["127.0.0.1:${REDIS_PORT:-6379}:6379"]
    volumes: [redis-data:/data]
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  elasticsearch:
    <<: *common
    build:
      context: ./infra/local/elasticsearch
      args:
        ELASTICSEARCH_VERSION: 9.5.4
    profiles: [data, backend, worker, full]
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      node.processors: "1"
      ES_JAVA_OPTS: -Xms384m -Xmx384m -XX:ActiveProcessorCount=1
    ports: ["127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200"]
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent "http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s" >/dev/null']
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 30s

  rabbitmq:
    <<: *common
    image: rabbitmq:4.3.6-management-alpine
    profiles: [data, backend, worker, full]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-secondbrain}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-local-rabbit-password}
      RABBITMQ_DEFAULT_VHOST: secondbrain
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/local/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20

  neo4j:
    <<: *common
    image: neo4j:2026.09.0-community
    profiles: [data, backend, ai, worker, full]
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local-neo4j-password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 384m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes: [neo4j-data:/data]
    mem_limit: 768m
    cpus: 1.0
    healthcheck:
      test: [CMD-SHELL, 'wget --quiet --spider http://localhost:7474 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    <<: *common
    build: ./backend/secondbrain
    profiles: [backend, worker, full]
    env_file:
      - path: ./infra/local/.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/secondbrain
      POSTGRES_USER: secondbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-postgres-password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
      ELASTICSEARCH_URIS: elasticsearch:9200
      ELASTICSEARCH_USERNAME: ""
      ELASTICSEARCH_PASSWORD: ""
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-local-neo4j-password}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: ${RABBITMQ_USER:-secondbrain}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-local-rabbit-password}
      RABBITMQ_VIRTUAL_HOST: secondbrain
      RABBITMQ_SSL_ENABLED: "false"
      BASE_URL: http://localhost:${BACKEND_PORT:-8080}
      OAUTH2_REDIRECT_URL: http://localhost:5173
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-*}
      JWT_COOKIE_SECURE: "false"
      JAVA_OPTS: -XX:MaxRAMPercentage=55.0 -XX:ActiveProcessorCount=2
    ports: ["127.0.0.1:${BACKEND_PORT:-8080}:8080"]
    mem_limit: 768m
    cpus: 1.0
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      elasticsearch: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      neo4j: {condition: service_healthy}
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  ai:
    <<: *common
    build: ./knowledge-graph-service
    profiles: [ai, full]
    environment: *ai-env
    ports: ["127.0.0.1:${AI_PORT:-8000}:8000"]
    mem_limit: 512m
    cpus: 0.75
    depends_on:
      neo4j: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    <<: *common
    build:
      context: ./knowledge-graph-service
      dockerfile: Dockerfile.worker
    profiles: [worker, full]
    environment: *ai-env
    mem_limit: 512m
    cpus: 0.5
    depends_on:
      neo4j: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      backend: {condition: service_healthy}

volumes:
  postgres18-data:
  redis-data:
  elasticsearch-data:
  rabbitmq-data:
  neo4j-data:
